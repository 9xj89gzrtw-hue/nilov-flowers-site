  fld.appendChild(inner);
  return fld;
}

function markDirty(path) {
  const topKey = path.split(/[.\[]/)[0];
  if(!S.dirty.has(topKey)) {
    S.dirty.add(topKey);
    updateDirtyUI();
  } else {
    updateDirtyUI(); // refresh counts
  }
  scheduleAutosave();
  schedulePreviewReload();
}
function updateDirtyUI() {
  const n = totalDirtyFields();
  $('#savebarN').textContent = n;
  $('#savebar').classList.toggle('is-visible', n > 0);
  // status
  const st = $('#status');
  st.className = 'status ' + (n > 0 ? 'is-dirty' : 'is-clean');
  $('#statusT').textContent = n > 0 ? n+' несохранённых' : 'Синхронизировано';
  // tab title
  document.title = (n > 0 ? '● ' : '') + 'НИЛОВ · Админ · v2026';
  // sidebar dots
  refreshSidebarDirty();
}
function refreshSidebarDirty() {
  $$('.item').forEach(it => it.classList.remove('is-dirty'));
  $$('.group').forEach(g => g.classList.remove('is-dirty'));
  S.dirty.forEach(k => {
    $$('.item').forEach(it => {
      if(LABELS[k] && it.querySelector('.item__t')?.textContent === LABELS[k]) it.classList.add('is-dirty');
    });
    const gId = GROUP_OF[k];
    if(gId) {
      const g = $$('.group').find(grp => grp.querySelector('.group__t')?.textContent === GROUPS.find(g=>g.id===gId)?.label);
      if(g) g.classList.add('is-dirty');
    }
  });
}
function totalDirtyFields() {
  if(!S.original) return 0;
  let n = 0;
  S.dirty.forEach(k => { n += countDeepDiff(S.original[k], S.working[k]); });
  return n;
}

/* ---- text ---- */
function renderText(key, value, path, opts={}) {
  const id = 'f-' + path.replace(/[^\w]/g,'_');
  const input = el('input', 'input'+(opts.mono?' mono':''));
  input.type = 'text';
  input.id = id;
  input.value = value == null ? '' : String(value);
  input.dataset.path = path;
  input.addEventListener('input', () => {
    pathSet(S.working, path, input.value);
    markDirty(path);
  });
  const fld = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  lbl.htmlFor = id;
  fld.appendChild(lbl);
  fld.appendChild(input);
  return fld;
}

/* ---- textarea ---- */
function renderTextarea(key, value, path, opts={}) {
  const id = 'f-' + path.replace(/[^\w]/g,'_');
  const ta = el('textarea', 'textarea' + (opts.large?' lg':''));
  ta.id = id;
  ta.value = value == null ? '' : String(value);
  ta.dataset.path = path;
  ta.rows = opts.large ? 5 : 3;
  ta.addEventListener('input', () => {
    pathSet(S.working, path, ta.value);
    markDirty(path);
    autoGrow(ta);
  });
  setTimeout(autoGrow, 0, ta);
  const fld = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  lbl.htmlFor = id;
  fld.appendChild(lbl);
  fld.appendChild(ta);
  return fld;
}
function autoGrow(ta) {
  if(!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.max(ta.scrollHeight, 60) + 'px';
}

/* ---- richtext ---- */
function renderRichtext(key, value, path, opts={}) {
  const id = 'f-' + path.replace(/[^\w]/g,'_');
  const wrap = el('div','rt');
  const tb = el('div','rt__tb');
  const buttons = [
    ['bold', '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2h5a2.5 2.5 0 0 1 0 5H3zM3 7h5.5a2.5 2.5 0 0 1 0 5H3z"/></svg>'],
    ['italic', '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 2h6M3 12h6M9 2L5 12"/></svg>'],
    ['h2', '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3v8M7 3v8M2 7h5M10 11l1-2c-1-.5-1-2 0-2s1.5 1 0 2-1 2 0 2z"/></svg>'],
    ['link', '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 9L9 5M4 8a2 2 0 0 1 0-3l1-1a2 2 0 0 1 3 0M10 6a2 2 0 0 1 0 3l-1 1a2 2 0 0 1-3 0"/></svg>'],
  ];
  buttons.forEach(([cmd, ic]) => {
    const b = el('button','rt__b', ic);
    b.type = 'button';
    b.title = cmd;
    b.dataset.cmd = cmd;
    b.addEventListener('click', e => { e.preventDefault(); rtCmd(b, cmd); });
    tb.appendChild(b);
  });
  const sep = el('div','rt__sep'); tb.appendChild(sep);
  const clearBtn = el('button','rt__b', '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3l8 8M11 3L3 11"/></svg>');
  clearBtn.type='button'; clearBtn.title='Очистить форматирование';
  clearBtn.addEventListener('mousedown', e => { e.preventDefault(); document.execCommand('removeFormat'); });
  tb.appendChild(clearBtn);
  const ed = el('div','rt__ed');
  ed.contentEditable = 'true';
  ed.dataset.path = path;
  ed.dataset.placeholder = opts.placeholder || 'Введите текст…';
  ed.innerHTML = value || '';
  ed.addEventListener('input', () => {
    pathSet(S.working, path, ed.innerHTML);
    markDirty(path);
  });
  wrap.appendChild(tb);
  wrap.appendChild(ed);
  const fld = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  lbl.htmlFor = id;
  fld.appendChild(lbl);
  fld.appendChild(wrap);
  return fld;
}
function rtCmd(btn, cmd) {
  document.execCommand(cmd, false, null);
  const ed = btn.closest('.rt').querySelector('.rt__ed');
  ed.focus();
  // update
  pathSet(S.working, ed.dataset.path, ed.innerHTML);
  markDirty(ed.dataset.path);
}

/* ---- number ---- */
function renderNumber(key, value, path, opts={}) {
  const id = 'f-' + path.replace(/[^\w]/g,'_');
  const inp = el('input','input mono');
  inp.type = 'number';
  inp.id = id;
  inp.value = value == null ? '' : value;
  inp.dataset.path = path;
  if(opts.step) inp.step = opts.step;
  if(opts.min != null) inp.min = opts.min;
  inp.addEventListener('input', () => {
    const v = inp.value === '' ? 0 : Number(inp.value);
    pathSet(S.working, path, v);
    markDirty(path);
  });
  const grp = el('div','input-grp');
  grp.appendChild(inp);
  if(opts.suffix) {
    const suf = el('div','input-grp__suf', opts.suffix);
    grp.appendChild(suf);
  }
  const fld = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  lbl.htmlFor = id;
  fld.appendChild(lbl);
  fld.appendChild(grp);
  return fld;
}

/* ---- range ---- */
function renderRange(key, value, path, opts={}) {
  const id = 'f-' + path.replace(/[^\w]/g,'_');
  const r = el('input');
  r.type = 'range';
  r.id = id;
  r.min = opts.min != null ? opts.min : 0;
  r.max = opts.max != null ? opts.max : 1;
  r.step = opts.step != null ? opts.step : 0.05;
  r.value = value;
  const val = el('span','range__val', value);
  r.addEventListener('input', () => {
    val.textContent = r.value;
    pathSet(S.working, path, Number(r.value));
    markDirty(path);
  });
  const range = el('div','range');
  range.appendChild(r);
  range.appendChild(val);
  const fld = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  lbl.htmlFor = id;
  fld.appendChild(lbl);
  fld.appendChild(range);
  return fld;
}

/* ---- color ---- */
function renderColor(key, value, path, opts={}) {
  const id = 'f-' + path.replace(/[^\w]/g,'_');
  const v = String(value || '#000000');
  const hex = v.startsWith('#') ? v : '#'+v;
  const color = el('input');
  color.type = 'color';
  color.value = /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : '#000000';
  color.addEventListener('input', () => {
    text.value = color.value;
    pathSet(S.working, path, color.value);
    markDirty(path);
  });
  const text = el('input','input mono');
  text.type = 'text';
  text.value = v;
  text.dataset.path = path;
  text.addEventListener('input', () => {
    if(/^#?[0-9a-fA-F]{6}$/.test(text.value)) {
      color.value = text.value.startsWith('#') ? text.value : '#'+text.value;
      pathSet(S.working, path, text.value);
      markDirty(path);
    }
  });
  const c = el('div','color');
  c.appendChild(color);
  c.appendChild(text);
  const fld = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  lbl.htmlFor = id;
  fld.appendChild(lbl);
  fld.appendChild(c);
  return fld;
}

/* ---- toggle ---- */
function renderToggle(key, value, path, opts={}) {
  const id = 'f-' + path.replace(/[^\w]/g,'_');
  const inp = el('input');
  inp.type = 'checkbox';
  inp.id = id;
  inp.checked = !!value;
  inp.dataset.path = path;
  inp.addEventListener('change', () => {
    lblText.textContent = inp.checked ? 'Вкл' : 'Выкл';
    lblText.className = 'toggle__lbl' + (inp.checked?' is-on':'');
    pathSet(S.working, path, inp.checked);
    markDirty(path);
  });
  const track = el('span','toggle__track');
  const thumb = el('span','toggle__thumb');
  track.appendChild(thumb);
  const lblText = el('span','toggle__lbl' + (value?' is-on':''), value?'Вкл':'Выкл');
  const lbl = el('label','toggle');
  lbl.appendChild(inp);
  lbl.appendChild(track);
  lbl.appendChild(lblText);
  const fld = el('div','fld');
  const lab = el('label','fld__lbl', fldLblHtml(key, opts));
  lab.htmlFor = id;
  fld.appendChild(lab);
  fld.appendChild(lbl);
  return fld;
}

/* ---- select ---- */
function renderSelect(key, value, path, options, opts={}) {
  const id = 'f-' + path.replace(/[^\w]/g,'_');
  const sel = el('select','select');
  sel.id = id;
  sel.dataset.path = path;
  options.forEach(o => {
    const opt = el('option');
    opt.value = o.value;
    opt.textContent = o.label;
    if(o.value === value) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    pathSet(S.working, path, sel.value);
    markDirty(path);
  });
  const fld = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  lbl.htmlFor = id;
  fld.appendChild(lbl);
  fld.appendChild(sel);
  return fld;
}

/* ---- chips (array of primitives) ---- */
function renderChips(key, value, path, opts={}) {
  const arr = Array.isArray(value) ? value.slice() : [];
  const wrap = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  wrap.appendChild(lbl);
  const container = el('div','chips');
  container.dataset.path = path;
  function render() {
    container.innerHTML = '';
    arr.forEach((v, i) => {
      const chip = el('span','chip', esc(String(v)) + '<button class="chip__x" type="button" aria-label="Удалить">'+I.x+'</button>');
      chip.querySelector('.chip__x').addEventListener('click', () => {
        arr.splice(i, 1);
        pathSet(S.working, path, arr.slice());
        markDirty(path);
        render();
      });
      container.appendChild(chip);
    });
    const input = el('input','chips__input');
    input.type = 'text';
    input.placeholder = 'Добавить + Enter';
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter' && input.value.trim()) {
        e.preventDefault();
        arr.push(input.value.trim());
        pathSet(S.working, path, arr.slice());
        markDirty(path);
        input.value = '';
        render();
      }
    });
    container.appendChild(input);
  }
  render();
  wrap.appendChild(container);
  if(opts.help) { const h = el('div','fld__help', opts.help); wrap.appendChild(h); }
  return wrap;
}

/* ---- multi-chips with fixed options ---- */
function renderMultiChips(key, value, path, options, opts={}) {
  const arr = Array.isArray(value) ? value.slice() : [];
  const wrap = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  wrap.appendChild(lbl);
  const chipsW = el('div','chips');
  function renderChips() {
    chipsW.innerHTML = '';
    arr.forEach((v, i) => {
      const opt = options.find(o => o.value === v);
      const chip = el('span','chip is-on', esc(opt?opt.label:v) + '<button class="chip__x" type="button">'+I.x+'</button>');
      chip.querySelector('.chip__x').addEventListener('click', () => {
        arr.splice(i, 1);
        pathSet(S.working, path, arr.slice());
        markDirty(path);
        renderChips(); renderOpts();
      });
      chipsW.appendChild(chip);
    });
    if(arr.length === 0) {
      const e = el('span','fld__help','— ничего не выбрано —');
      e.style.padding = '0 4px';
      chipsW.appendChild(e);
    }
  }
  const optsW = el('div','chips__opts');
  function renderOpts() {
    optsW.innerHTML = '';
    options.forEach(o => {
      if(arr.includes(o.value)) return;
      const b = el('button','chips__opt', '+ '+esc(o.label));
      b.type = 'button';
      b.addEventListener('click', () => {
        arr.push(o.value);
        pathSet(S.working, path, arr.slice());
        markDirty(path);
        renderChips(); renderOpts();
      });
      optsW.appendChild(b);
    });
    if(optsW.children.length === 0) optsW.style.display = 'none';
    else optsW.style.display = '';
  }
  renderChips();
  renderOpts();
  wrap.appendChild(chipsW);
  wrap.appendChild(optsW);
  return wrap;
}

/* ---- image ---- */
function renderImage(key, value, path, opts={}) {
  const wrap = el('div','fld');
  const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
  wrap.appendChild(lbl);
  const url = String(value || '');
  const main = el('div','img-fld__main');
  const urlInput = el('input','input img-fld__url');
  urlInput.type = 'text';
  urlInput.value = url;
  urlInput.dataset.path = path;
  urlInput.placeholder = '/img/…';
  urlInput.addEventListener('input', () => {
    pathSet(S.working, path, urlInput.value);
    markDirty(path);
    updateThumb(urlInput.value);
  });
  const btns = el('div','img-fld__btns');
  const uploadBtn = el('button','btn btn--ink btn--sm', 'Загрузить');
  uploadBtn.type = 'button';
  uploadBtn.addEventListener('click', () => fileInput.click());
  const libBtn = el('button','btn btn--ghost btn--sm', 'Из библиотеки');
  libBtn.type = 'button';
  libBtn.addEventListener('click', () => openImgLibrary((chosenUrl) => {
    urlInput.value = chosenUrl;
    pathSet(S.working, path, chosenUrl);
    markDirty(path);
    updateThumb(chosenUrl);
  }));
  btns.appendChild(uploadBtn);
  btns.appendChild(libBtn);
  main.appendChild(urlInput);
  main.appendChild(btns);
  const progress = el('div','img-fld__progress');
  progress.innerHTML = '<span></span>';
  main.appendChild(progress);

  const thumb = el('div','img-fld__thumb'+(url?'':' empty'));
  if(url) {
    const img = el('img');
    img.src = url; img.alt = '';
    img.onerror = () => { thumb.classList.add('empty'); thumb.innerHTML = I.img; };
    thumb.appendChild(img);
  } else {
    thumb.innerHTML = I.img;
  }
  function updateThumb(newUrl) {
    thumb.classList.remove('empty','is-drag');
    thumb.innerHTML = '';
    if(newUrl) {
      const img = el('img');
      img.src = newUrl; img.alt = '';
      img.onerror = () => { thumb.classList.add('empty'); thumb.innerHTML = I.img; };
      thumb.appendChild(img);
    } else {
      thumb.classList.add('empty');
      thumb.innerHTML = I.img;
    }
  }
  // file input hidden
  const fileInput = el('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/webp,image/jpeg,image/png,image/avif,image/gif';
  fileInput.style.display = 'none';
  fileInput.addEventListener('change', async () => {
    if(fileInput.files && fileInput.files[0]) await doUpload(fileInput.files[0], progress, (newUrl) => {
      urlInput.value = newUrl;
      pathSet(S.working, path, newUrl);
      markDirty(path);
      updateThumb(newUrl);
    });
    fileInput.value = '';
  });
  // paste support
  urlInput.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if(!items) return;
    for(const it of items) {
      if(it.type.startsWith('image/')) {
        e.preventDefault();
        const f = it.getAsFile();
        if(f) doUpload(f, progress, (newUrl) => {
          urlInput.value = newUrl;
          pathSet(S.working, path, newUrl);
          markDirty(path);
          updateThumb(newUrl);
        });
        return;
      }
    }
  });
  // drag-drop on thumb
  ['dragenter','dragover'].forEach(ev => thumb.addEventListener(ev, e => { e.preventDefault(); thumb.classList.add('is-drag'); }));
  ['dragleave','drop'].forEach(ev => thumb.addEventListener(ev, e => { e.preventDefault(); thumb.classList.remove('is-drag'); }));
  thumb.addEventListener('drop', async e => {
    if(e.dataTransfer?.files?.[0]) await doUpload(e.dataTransfer.files[0], progress, (newUrl) => {
      urlInput.value = newUrl;
      pathSet(S.working, path, newUrl);
      markDirty(path);
      updateThumb(newUrl);
    });
  });
  const row = el('div','img-fld');
  row.appendChild(thumb);
  row.appendChild(main);
  row.appendChild(fileInput);
  wrap.appendChild(row);
  return wrap;
}
async function doUpload(file, progress, cb) {
  if(!file.type.startsWith('image/')) { toast('err','Ошибка','Можно загружать только изображения'); return; }
  if(file.size > 5*1024*1024) { toast('err','Файл слишком большой','Макс. 5 МБ'); return; }
  progress.classList.add('is-active');
  progress.querySelector('span').style.width = '0%';
  try {
    const r = await uploadFile(file, S.auth.token, p => { progress.querySelector('span').style.width = Math.round(p*100)+'%'; });
    if(r.url) cb(r.url);
    toast('ok','Загружено', r.name || '');
  } catch(e) {
    toast('err','Ошибка загрузки', e.message);
  } finally {
    setTimeout(() => progress.classList.remove('is-active'), 600);
  }
}

/* ---- repeater (array of objects) ---- */
function renderRepeater(key, value, path, opts={}) {
  const arr = Array.isArray(value) ? value.slice() : [];
  const wrap = el('div','fld');
  const lbl = el('label','fld__lbl');
  function _hdrHtml() {
    const human = opts.label || LABELS[key] || FIELD_LABELS[key] || key;
    const showKey = !opts.label && !LABELS[key] && !!FIELD_LABELS[key] && FIELD_LABELS[key] !== key;
    return esc(human) + (showKey ? ' <code class="fld__key">'+esc(key)+'</code>' : '') + ' <span class="hint">'+arr.length+' элем.</span>';
  }
  lbl.innerHTML = _hdrHtml();
  wrap.appendChild(lbl);
  const container = el('div','rep');
  container.dataset.path = path;
  function itemTitle(item, idx) {
    if(!item || typeof item !== 'object') return 'Элемент '+(idx+1);
    return item.name || item.label || item.title || item.id || item.q || item.code || item.tag || ('Элемент '+(idx+1));
  }
  function renderItems() {
    container.innerHTML = '';
    if(arr.length === 0) {
      const e = el('div','rep__empty','Список пуст. Нажмите «Добавить», чтобы создать первый элемент.');
      container.appendChild(e);
    }
    arr.forEach((item, idx) => {
      const isObj = item && typeof item === 'object' && !Array.isArray(item);
      const card = el('div','rep__item');
      card.dataset.idx = idx;
      const isItemDirty = isObj ? JSON.stringify(item) !== JSON.stringify((S.original && pathGet(S.original, path+'['+idx+']')) || item) : false;
      if(isItemDirty) card.classList.add('is-dirty');
      const hd = el('div','rep__item-hd');
      const drag = el('button','rep__drag', I.grip);
      drag.type='button'; drag.setAttribute('aria-label','Перетащить');
      drag.draggable = true;
      drag.addEventListener('dragstart', e => { card.classList.add('is-dragging'); e.dataTransfer.setData('text/plain', String(idx)); e.dataTransfer.effectAllowed='move'; });
      drag.addEventListener('dragend', () => card.classList.remove('is-dragging'));
      card.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; });
      card.addEventListener('drop', e => {
        e.preventDefault();
        const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if(isNaN(from) || from === idx) return;
        const moved = arr.splice(from, 1)[0];
        arr.splice(idx, 0, moved);
        pathSet(S.working, path, arr.slice());
        markDirty(path);
        renderItems();
      });
      const title = el('div','rep__item-t', '<span class="idx">#'+(idx+1)+'</span>'+esc(itemTitle(item, idx))+(isObj && item.sub ? '<span class="preview">· '+esc(String(item.sub).slice(0,40))+'</span>':''));
      const actions = el('div','rep__item-actions');
      const dirtyDot = el('span','rep__item-dirty');
      const toggle = el('button','rep__act', I.chev);
      toggle.type='button'; toggle.title='Свернуть/развернуть';
      toggle.addEventListener('click', () => card.classList.toggle('is-open'));
      const dup = el('button','rep__act', I.copy);
      dup.type='button'; dup.title='Дублировать';
      dup.addEventListener('click', () => {
        const copy = clone(item);
        arr.splice(idx+1, 0, copy);
        pathSet(S.working, path, arr.slice());
        markDirty(path);
        renderItems();
        setTimeout(() => { const next = container.querySelectorAll('.rep__item')[idx+1]; if(next) { next.classList.add('is-open'); next.scrollIntoView({behavior:'smooth',block:'nearest'}); } }, 30);
      });
      const del = el('button','rep__act is-danger', I.trash);
      del.type='button'; del.title='Удалить';
      del.addEventListener('click', () => {
        if(confirm('Удалить элемент «'+itemTitle(item, idx)+'»?')) {
          arr.splice(idx, 1);
          pathSet(S.working, path, arr.slice());
          markDirty(path);
          renderItems();
        }
      });
      actions.appendChild(dirtyDot);
      actions.appendChild(toggle);
      actions.appendChild(dup);
      actions.appendChild(del);
      hd.appendChild(drag);
      hd.appendChild(title);
      hd.appendChild(actions);
      card.appendChild(hd);
      // body
      const body = el('div','rep__item-body');
      if(isObj) {
        const schema = opts.schema || Object.keys(item);
        // Two-column layout for short rows
        const isShortRow = schema.length <= 4 && schema.every(k => typeof item[k] !== 'object');
        if(isShortRow) {
          const row = el('div','card__row r'+Math.min(schema.length, 2));
          schema.forEach(k => {
            const cell = el('div');
            const f = renderValue(k, item[k], path+'['+idx+'].'+k);
            cell.appendChild(f);
            row.appendChild(cell);
          });
          body.appendChild(row);
        } else {
          schema.forEach(k => {
            const f = renderValue(k, item[k], path+'['+idx+'].'+k);
            body.appendChild(f);
          });
        }
        // auto-expand for first 3 items
        if(idx < 3) card.classList.add('is-open');
      } else {
        // primitive array item
        const f = renderValue('val', item, path+'['+idx+']', {label: 'Значение'});
        body.appendChild(f);
        card.classList.add('is-open');
      }
      card.appendChild(body);
      container.appendChild(card);
    });
    // update label count
    lbl.innerHTML = _hdrHtml();
    // add button
    const add = el('button','rep__add', I.plus+' Добавить элемент');
    add.type='button';
    add.addEventListener('click', () => {
      const sample = arr[0] || {};
      let newItem;
      if(sample && typeof sample === 'object' && !Array.isArray(sample)) {
        newItem = {};
        Object.keys(sample).forEach(k => {
          const v = sample[k];
          if(Array.isArray(v)) newItem[k] = [];
          else if(v && typeof v === 'object') newItem[k] = {};
          else if(typeof v === 'number') newItem[k] = 0;
          else if(typeof v === 'boolean') newItem[k] = false;
          else newItem[k] = '';
        });
      } else {
        newItem = '';
      }
      arr.push(newItem);
      pathSet(S.working, path, arr.slice());
      markDirty(path);
      renderItems();
      setTimeout(() => {
        const last = container.querySelector('.rep__item:last-child');
        if(last) { last.classList.add('is-open'); last.scrollIntoView({behavior:'smooth',block:'nearest'}); }
      }, 30);
    });
    container.appendChild(add);
  }
  renderItems();
  wrap.appendChild(container);
  return wrap;
}

/* ---- group (nested object) ---- */
function renderGroup(key, value, path, opts={}) {
  // value is an object
  const wrap = el('div','fld');
  if(opts.label || FIELD_LABELS[key]) {
    const lbl = el('label','fld__lbl', fldLblHtml(key, opts));
    wrap.appendChild(lbl);
  }
  const grp = el('div','grp');
  const keys = Object.keys(value);
  // smart layout: 2-column for short primitive groups
  const allShort = keys.length <= 4 && keys.every(k => typeof value[k] !== 'object' || value[k] === null);
  if(allShort && keys.length > 1) {
    const row = el('div','card__row r2');
    keys.forEach(k => {
      const cell = el('div');
      const f = renderValue(k, value[k], path+'.'+k);
      cell.appendChild(f);
      row.appendChild(cell);
    });
    grp.appendChild(row);
  } else {
    keys.forEach(k => {
      const f = renderValue(k, value[k], path+'.'+k);
      grp.appendChild(f);
    });
  }
  wrap.appendChild(grp);
  return wrap;
}

/* ============================================================
   PRODUCTS GRID + DRAWER
   ============================================================ */
function renderProductsGrid(pane) {
  const products = S.working.products || [];
  const grid = el('div','prod-grid');
  products.forEach((p, idx) => {
    const isDirty = JSON.stringify(S.original?.products?.[idx]) !== JSON.stringify(p);
    const card = el('div','prod-card'+(isDirty?' is-dirty':''));
    const imgW = el('div','prod-card__img'+(p.img?'':' empty'));
    if(p.img) {
      const img = el('img');
      img.src = p.img; img.alt = p.name || ''; img.loading = 'lazy';
      img.onerror = () => { imgW.classList.add('empty'); imgW.innerHTML = I.img; };
      imgW.appendChild(img);
    } else { imgW.innerHTML = I.img; }
    if(p.badge) {
      const b = el('div','prod-card__badge', esc(p.badge));
      imgW.appendChild(b);
    }
    const vis = el('div','prod-card__visibility'+(p.visible===false?' is-hidden':''), p.visible===false?I.eyeOff:I.eye);
    imgW.appendChild(vis);
    const body = el('div','prod-card__body');
    body.innerHTML =
      '<div class="prod-card__name">'+esc(p.name||'Без названия')+'</div>' +
      '<div class="prod-card__sub">'+esc(p.sub||'')+'</div>' +
      '<div class="prod-card__price"><span class="p">'+esc(fmtPrice(p.price))+'</span>'+(p.old?'<span class="o">'+esc(fmtPrice(p.old))+'</span>':'')+'</div>';
    const idT = el('div','prod-card__id', esc(p.id||''));
    imgW.appendChild(idT);
    card.appendChild(imgW);
    card.appendChild(body);
    card.addEventListener('click', () => openProductDrawer(idx));
    grid.appendChild(card);
  });
  pane.appendChild(grid);
}
function fmtPrice(p) {
  if(p == null) return '';
  return Number(p).toLocaleString('ru-RU') + ' ₽';
}

function openProductDrawer(idx) {
  const p = S.working.products[idx];
  if(!p) return;
  const drawer = $('#drawer');
  const overlay = $('#drawerOverlay');
  $('#drawerTitle').textContent = p.name || 'Товар';
  $('#drawerId').textContent = p.id + ' · #' + (idx+1);
  const body = $('#drawerBody');
  body.innerHTML = '';
  // image pair
  const imgRow = el('div','card__row r2');
  imgRow.appendChild(renderValue('img', p.img, 'products['+idx+'].img', {label:'Главное фото'}));
  imgRow.appendChild(renderValue('img2', p.img2, 'products['+idx+'].img2', {label:'Доп. фото'}));
  body.appendChild(imgRow);
  // name + id
  const idRow = el('div','card__row r2');
  idRow.appendChild(renderValue('name', p.name, 'products['+idx+'].name', {label:'Название'}));
  idRow.appendChild(renderValue('id', p.id, 'products['+idx+'].id', {label:'ID товара'}));
  body.appendChild(idRow);
  // sub
  body.appendChild(renderValue('sub', p.sub, 'products['+idx+'].sub', {label:'Подзаголовок'}));
  // price + old
  const priceRow = el('div','card__row r2');
  priceRow.appendChild(renderNumber('price', p.price, 'products['+idx+'].price', {label:'Цена', suffix:'₽'}));
  priceRow.appendChild(renderNumber('old', p.old, 'products['+idx+'].old', {label:'Старая цена', suffix:'₽'}));
  body.appendChild(priceRow);
  // cat (select from categories)
  const catOpts = (S.working.categories||[]).map(c => ({value:c.id, label:c.label||c.id}));
  body.appendChild(renderSelect('cat', p.cat, 'products['+idx+'].cat', catOpts, {label:'Категория'}));
  // occ (multi-chips from occ)
  const occOpts = (S.working.occ||[]).map(o => ({value:o.id, label:o.label||o.id}));
  body.appendChild(renderMultiChips('occ', p.occ, 'products['+idx+'].occ', occOpts, {label:'Поводы'}));
  // flowers chips
  body.appendChild(renderChips('flowers', p.flowers, 'products['+idx+'].flowers', {label:'Состав (цветы)'}));
  // badge
  body.appendChild(renderText('badge', p.badge, 'products['+idx+'].badge', {label:'Бейдж'}));
  // size + weight
  const swRow = el('div','card__row r2');
  swRow.appendChild(renderText('size', p.size, 'products['+idx+'].size', {label:'Размер'}));
  swRow.appendChild(renderText('weight', p.weight, 'products['+idx+'].weight', {label:'Вес'}));
  body.appendChild(swRow);
  // desc richtext
  body.appendChild(renderRichtext('desc', p.desc, 'products['+idx+'].desc', {label:'Описание'}));
  // toggles
  const tgRow = el('div','card__row r2');
  tgRow.appendChild(renderToggle('popular', p.popular, 'products['+idx+'].popular', {label:'Хит'}));
  tgRow.appendChild(renderToggle('visible', p.visible, 'products['+idx+'].visible', {label:'Видим в каталоге'}));
  body.appendChild(tgRow);
  // reveal
  drawer.hidden = false;
  requestAnimationFrame(() => { drawer.classList.add('is-open'); overlay.classList.add('is-open'); document.body.classList.add('is-modal'); });
  setTimeout(()=>$('#drawerClose').focus(), 100);
}
function closeDrawer() {
  $('#drawer').classList.remove('is-open');
  $('#drawerOverlay').classList.remove('is-open');
  document.body.classList.remove('is-modal');
  setTimeout(()=>{ $('#drawer').hidden = true; }, 350);
  // refresh products grid to reflect changes
  if(S.current === 'products') renderSection('products');
}

/* ============================================================
   IMAGE LIBRARY MODAL
   ============================================================ */
let imgLibCallback = null;
async function openImgLibrary(cb) {
  imgLibCallback = cb;
  const overlay = $('#imgLibOverlay');
  overlay.classList.add('is-open');
  document.body.classList.add('is-modal');
  $('#imgLibSearch').value = '';
  $('#imgLibSearch').focus();
  const grid = $('#imgLibGrid');
  grid.innerHTML = '<div class="img-lib-empty">Загрузка…</div>';
  try {
    const r = await fetchJSON('/api/img-list');
    const imgs = r.images || [];
    if(imgs.length === 0) { grid.innerHTML = '<div class="img-lib-empty">Нет изображений</div>'; return; }
    renderImgLibGrid(imgs, '');
  } catch(e) {
    grid.innerHTML = '<div class="img-lib-empty">Ошибка: '+esc(e.message)+'</div>';
  }
}
function renderImgLibGrid(imgs, q) {
  const grid = $('#imgLibGrid');
  const filtered = q ? imgs.filter(i => i.name.toLowerCase().includes(q.toLowerCase())) : imgs;
  if(filtered.length === 0) { grid.innerHTML = '<div class="img-lib-empty">Ничего не найдено</div>'; return; }
  grid.innerHTML = '';
  filtered.forEach(img => {
    const it = el('div','img-lib-item');
    const im = el('img'); im.src = img.url; im.alt = img.name; im.loading = 'lazy';
    im.onerror = () => { it.style.display='none'; };
    it.appendChild(im);
    const n = el('div','name', esc(img.name));
    it.appendChild(n);
    it.addEventListener('click', () => {
      if(imgLibCallback) imgLibCallback(img.url);
      closeImgLibrary();
    });
    grid.appendChild(it);
  });
}
function closeImgLibrary() {
  $('#imgLibOverlay').classList.remove('is-open');
  document.body.classList.remove('is-modal');
  imgLibCallback = null;
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
function openCmdp() {
  const overlay = $('#cmdpOverlay');
  overlay.classList.add('is-open');
  document.body.classList.add('is-modal');
  const inp = $('#cmdpInput');
  inp.value = '';
  setTimeout(()=>{ inp.focus(); renderCmdp(''); }, 50);
}
function closeCmdp() {
  $('#cmdpOverlay').classList.remove('is-open');
  document.body.classList.remove('is-modal');
}
function renderCmdp(q) {
  const list = $('#cmdpList');
  const items = [];
  // sections
  GROUPS.forEach(g => {
    g.items.forEach(k => {
      const label = LABELS[k] || k;
      const searchText = (g.label + ' ' + label + ' ' + k).toLowerCase();
      if(!q || searchText.includes(q.toLowerCase())) {
        items.push({type:'section', group:g.label, label, key:k, ic:g.ic});
      }
    });
  });
  // actions
  const actions = [
    {type:'action', label:'Опубликовать', desc:'⌘S', action:publish},
    {type:'action', label:'Сохранить черновик', desc:'autosave', action:saveDraft},
    {type:'action', label:'Обновить превью', desc:'', action:()=>reloadPreview()},
    {type:'action', label:'Выйти', desc:'', action:logout},
  ];
  actions.forEach(a => {
    if(!q || a.label.toLowerCase().includes(q.toLowerCase())) items.push({...a, ic:I.system});
  });
  if(items.length === 0) { list.innerHTML = '<div class="cmdp__empty">Ничего не найдено</div>'; return; }
  S.cmdpIndex = 0;
  list.innerHTML = '';
  let lastGroup = '';
  items.forEach((it, idx) => {
    if(it.type === 'section' && it.group !== lastGroup) {
      lastGroup = it.group;
      const g = el('div','cmdp__group', esc(it.group));
      list.appendChild(g);
    }
    const row = el('div','cmdp__item'+(idx===0?' is-active':''), '<span class="cmdp__item-ic">'+it.ic+'</span><span class="cmdp__item-t">'+esc(it.label)+'</span>'+(it.desc?'<span class="cmdp__item-s">'+esc(it.desc)+'</span>':''));
    row.dataset.idx = idx;
    row.addEventListener('mouseenter', () => { S.cmdpIndex = idx; updateCmdpActive(); });
    row.addEventListener('click', () => execCmdpItem(items[idx]));
    list.appendChild(row);
  });
  S.cmdpItems = items;
  updateCmdpActive();
}
function updateCmdpActive() {
  $$('.cmdp__item').forEach((r, i) => r.classList.toggle('is-active', i === S.cmdpIndex));
  const active = $$('.cmdp__item')[S.cmdpIndex];
  if(active) active.scrollIntoView({block:'nearest'});
}
function execCmdpItem(it) {
  if(!it) return;
  closeCmdp();
  if(it.type === 'section') navigateTo(it.key);
  else if(it.action) it.action();
}

/* ============================================================
   SAVE / AUTOSAVE / PUBLISH
   ============================================================ */
function scheduleAutosave() {
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(saveDraft, 1500);
}
async function saveDraft() {
  if(!S.dirty.size) return;
  const st = $('#status');
  st.className = 'status is-saving';
  $('#statusT').textContent = 'Сохранение черновика…';
  try {
    const body = JSON.stringify(S.working);
    const r = await postContent(body, S.auth.token);
    if(r.ok) {
      S.original = clone(S.working);
      S.dirty.clear();
      updateDirtyUI();
      st.className = 'status is-saved';
      $('#statusT').textContent = 'Черновик сохранён · ' + nowTime();
      toast('ok','Черновик сохранён', nowTime());
      // iframe already shows latest because content.json is written
      reloadPreview();
    } else {
      throw new Error(r.error || 'failed');
    }
  } catch(e) {
    st.className = 'status is-clean';
    $('#statusT').textContent = 'Ошибка сохранения';
    toast('err','Ошибка сохранения', e.message);
  }
}
async function publish() {
  if(!S.working) return;
  const st = $('#status');
  st.className = 'status is-saving';
  $('#statusT').textContent = 'Публикация…';
  // bump updatedAt
  S.working.updatedAt = new Date().toISOString();
  try {
    const body = JSON.stringify(S.working);
    const r = await postContent(body, S.auth.token);
    if(r.ok) {
      S.original = clone(S.working);
      S.dirty.clear();
      updateDirtyUI();
      st.className = 'status is-saved';
      $('#statusT').textContent = 'Опубликовано · ' + nowTime();
      toast('ok','Опубликовано', 'Витрина обновлена · ' + nowTime());
      reloadPreview();
      if(S.current === 'updatedAt') renderSection('updatedAt');
    } else {
      throw new Error(r.error || 'failed');
    }
  } catch(e) {
    st.className = 'status is-clean';
    $('#statusT').textContent = 'Ошибка публикации';
    toast('err','Ошибка публикации', e.message);
  }
}
function discard() {
  if(!confirm('Отменить все несохранённые изменения?')) return;
  S.working = clone(S.original);
  S.dirty.clear();
  updateDirtyUI();
  renderSection(S.current);
  toast('info','Изменения отменены', 'Восстановлена последняя сохранённая версия');
  reloadPreview();
}
function logout() {
  if(S.dirty.size && !confirm('Есть несохранённые изменения. Выйти без сохранения?')) return;
  clearSession();
  showLogin();
  location.reload();
}
function nowTime() {
  return new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

/* ============================================================
   PREVIEW
   ============================================================ */
function schedulePreviewReload(force) {
  clearTimeout(S.previewTimer);
  S.previewTimer = setTimeout(() => reloadPreview(), force ? 0 : 800);
}
function reloadPreview() {
  const f = $('#previewFrame');
  S.previewTs = Date.now();
  f.src = '/?preview=' + S.previewTs + '&admin=1';
}
function setViewport(vp) {
  const wrap = $('#previewWrap');
  wrap.classList.remove('is-mobile','is-tablet');
  if(vp === 'mobile') wrap.classList.add('is-mobile');
  else if(vp === 'tablet') wrap.classList.add('is-tablet');
  $$('.vp-btn').forEach(b => b.classList.toggle('is-active', b.dataset.vp === vp));
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(kind, title, sub) {
  const wrap = $('#toastWrap');
  const t = el('div','toast is-'+kind, '<span class="toast__ic">'+(kind==='ok'?I.check:kind==='err'?I.alert:I.clock)+'</span><div class="toast__t"><strong>'+esc(title)+'</strong>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</div>');
  wrap.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(()=>t.remove(), 400); }, 3500);
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function wireEvents() {
  // login
  $('#li-btn').addEventListener('click', doLogin);
  $('#li-pass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  $('#li-login').addEventListener('keydown', e => { if(e.key === 'Enter') $('#li-pass').focus(); });

  // topbar
  $('#searchBtn').addEventListener('click', openCmdp);
  $('#publishTopBtn').addEventListener('click', publish);
  $('#logoutBtn').addEventListener('click', logout);
  $('#hamb').addEventListener('click', () => $('#app').classList.toggle('is-sidebar-open'));
  $('#mobileBackdrop').addEventListener('click', () => $('#app').classList.remove('is-sidebar-open'));
  $('#collapseBtn').addEventListener('click', () => $('#app').classList.toggle('is-icon'));

  // save bar
  $('#saveBtn').addEventListener('click', saveDraft);
  $('#publishBtn').addEventListener('click', publish);
  $('#discardBtn').addEventListener('click', discard);

  // preview
  $$('.vp-btn').forEach(b => b.addEventListener('click', () => setViewport(b.dataset.vp)));
  $('#previewRefresh').addEventListener('click', () => reloadPreview());
  // mobile tabs
  $$('.mobile-tab').forEach(b => b.addEventListener('click', () => {
    const tab = b.dataset.tab;
    $$('.mobile-tab').forEach(x => x.classList.remove('is-active'));
    b.classList.add('is-active');
    const main = $('#main');
    main.classList.remove('is-form-only','is-preview-only');
    if(tab === 'preview') main.classList.add('is-preview-only');
    else main.classList.add('is-form-only');
  }));

  // drawer
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#drawerOverlay').addEventListener('click', closeDrawer);

  // command palette input
  $('#cmdpInput').addEventListener('input', e => renderCmdp(e.target.value));

  // modals close
  $$('[data-close-modal]').forEach(b => b.addEventListener('click', () => {
    b.closest('.modal-overlay').classList.remove('is-open');
    document.body.classList.remove('is-modal');
  }));
  $('#imgLibOverlay').addEventListener('click', e => { if(e.target === $('#imgLibOverlay')) closeImgLibrary(); });
  $('#cmdpOverlay').addEventListener('click', e => { if(e.target === $('#cmdpOverlay')) closeCmdp(); });
  $('#imgLibSearch').addEventListener('input', e => {
    // re-fetch not needed; cache last results
    fetch('/api/img-list').then(r=>r.json()).then(r => renderImgLibGrid(r.images||[], e.target.value));
  });

  // keyboard shortcuts
  document.addEventListener('keydown', e => {
    // ⌘K / Ctrl+K
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdp(); return; }
    // ⌘S / Ctrl+S
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); publish(); return; }
    // Esc
    if(e.key === 'Escape') {
      if($('#cmdpOverlay').classList.contains('is-open')) { closeCmdp(); return; }
      if($('#imgLibOverlay').classList.contains('is-open')) { closeImgLibrary(); return; }
      if($('#drawer').classList.contains('is-open')) { closeDrawer(); return; }
    }
    // command palette nav
    if($('#cmdpOverlay').classList.contains('is-open')) {
      const items = S.cmdpItems || [];
      if(e.key === 'ArrowDown') { e.preventDefault(); S.cmdpIndex = Math.min(S.cmdpIndex+1, items.length-1); updateCmdpActive(); }
      else if(e.key === 'ArrowUp') { e.preventDefault(); S.cmdpIndex = Math.max(S.cmdpIndex-1, 0); updateCmdpActive(); }
      else if(e.key === 'Enter') { e.preventDefault(); execCmdpItem(items[S.cmdpIndex]); }
    }
  });

  // beforeunload
  window.addEventListener('beforeunload', e => {
    if(S.dirty.size > 0) {
      e.preventDefault();
      e.returnValue = 'Есть несохранённые изменения';
      return e.returnValue;
    }
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  wireEvents();
  const session = getSession();
  if(session) {
    // try to restore session by fetching content
    try {
      const content = await loadContent();
      S.original = content;
      S.working = clone(content);
      S.auth = session;
      showApp();
    } catch(e) {
      clearSession();
      showLogin();
    }
  } else {
    showLogin();
  }
}
init();
</script>
